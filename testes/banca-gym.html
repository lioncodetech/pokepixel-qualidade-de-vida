<!doctype html>
<meta charset="utf-8" />
<title>Banca do Ginásio do dia</title>
<!--
  Banca do painel do Ginásio, fora do jogo.

  O que ela prova: o painel sobe, lê os times do `PPX.times`, guarda as escolhas, e **a máquina de
  estados sobrevive às duas recargas** — que é a parte mais delicada desta ferramenta, porque cada
  F5 leva consigo tudo o que estiver só na memória.

  Corrida inteira medida aqui com `?jogo=1`, em três cargas de página (ou seja, dois F5):

    c1  time:Gym Kanto
    c1  F5
    c2  npc -> ginasio -> desafiar -> entrar-na-arena -> continuar
    c2  F5 (a tarefa já atravessa com etapa "time-volta", "Vitória!" e venceu: true)
    c3  time:Hunt

  Os dois pontos que isto prova e que nenhum teste de texto prova: o time da caçada é montado
  **depois** da segunda recarga, e o resultado do combate atravessa o F5 em vez de se perder nele.
  A corrida acaba em "não guardei de qual caçada você saiu" porque aqui não há caçada nenhuma —
  é a falha certa, dita com o motivo.

  O que ela não prova: nada que dependa do DOM do jogo. Sair da caçada, abrir o NPC, desafiar,
  esperar o combate. Isso só existe no jogo, e foi medido lá antes de ser escrito.

  Abra pelo servidor estático do projeto; por `file://` o navegador recusa carregar `../gym.js`.
-->
<style>
  body {
    margin: 0;
    height: 100vh;
    background: #2d5a3d;
    font-family: system-ui, sans-serif;
    color: #d8e6dc;
  }
  .nota {
    position: fixed;
    left: 16px;
    top: 16px;
    max-width: 26em;
    font-size: 13px;
    line-height: 1.5;
  }
  code {
    background: #0003;
    padding: 1px 4px;
    border-radius: 3px;
  }
  button.teste {
    background: #0004;
    color: inherit;
    border: 1px solid #ffffff33;
    border-radius: 6px;
    padding: 6px 10px;
    font: inherit;
    cursor: pointer;
    margin-right: 6px;
  }
  pre {
    background: #0004;
    padding: 8px;
    border-radius: 6px;
    font-size: 12px;
    max-width: 30em;
    white-space: pre-wrap;
  }
</style>
<div class="nota">
  <p>
    Banca do <b>Ginásio do dia</b>, sem o jogo. O painel está no canto. Não há caçada, nem NPC, nem
    ginásio — então <code>Fazer o ginásio de hoje</code> vai falhar num passo do jogo, e é isso que
    se quer ver: que ele <b>falha dizendo o motivo</b> em vez de ficar calado.
  </p>
  <p>
    <button class="teste" data-ver>Ver a tarefa guardada</button>
    <button class="teste" data-limpar>Limpar a tarefa</button>
  </p>
  <pre data-saida>—</pre>
</div>
<script>
  // `PPX` de mentira, com a porta que o Times abre de verdade.
  window.PPX = {
    modulo: (meta, fn) => fn(),
    times: {
      nomes: () => ['Hunt', 'Gym Kanto', 'Gym Johto'],
      usar: async (nome) => {
        // Entra na mesma linha do tempo dos cliques: e' assim que se ve' se a mochila abriu logo
        // a seguir ao resumo da partida, que foi a queixa.
        const l = JSON.parse(sessionStorage.getItem('banca:cliques') || '[]');
        l.push({ quem: `time:${nome}`, t: Date.now() });
        sessionStorage.setItem('banca:cliques', JSON.stringify(l));
        document.querySelector('[data-saida]').textContent = `PPX.times.usar(${JSON.stringify(nome)})`;
        await new Promise((r) => setTimeout(r, 300));
        return { ok: true, trocados: 6, segundos: 24 };
      },
    },
  };

  // Um jogo de mentira, ligado com ?jogo=1 — e montado ANTES do gym.js, para sobreviver ao F5 da
  // etapa de recarga. Sem isto não há como exercitar a parte que vem depois da recarga.
  //
  // O atraso de 4 s nos ginásios é o ponto: a janela do desafio entra no DOM antes do mapa, e foi
  // por procurar os ginásios uma única vez que a ferramenta dizia "não há ginásio marcado HOJE"
  // com o HOJE bem visível na tela.
  if (new URLSearchParams(location.search).has('jogo')) {
    // Marca a hora de cada clique que o jogo de mentira recebe. E' o que permite medir, depois da
    // corrida, se o tempo ficou **entre** os cliques em vez de amontoado antes deles.
    window.__cliques = JSON.parse(sessionStorage.getItem('banca:cliques') || '[]');
    const anotar = (quem) => {
      window.__cliques.push({ quem, t: Date.now() });
      sessionStorage.setItem('banca:cliques', JSON.stringify(window.__cliques));
    };

    const npc = document.createElement('div');
    npc.className = 'pokeidle-npc-label';
    const nome = document.createElement('b');
    nome.textContent = 'GYM';
    const falar = document.createElement('span');
    falar.textContent = 'Conversar';
    npc.append(nome, falar);
    document.body.append(npc);

    falar.addEventListener('click', () => {
      anotar('npc');
      if (document.querySelector('.pokeidle-panel')) return;
      const janela = document.createElement('div');
      janela.className = 'pokeidle-panel';
      janela.style.cssText =
        'position:fixed;left:10px;bottom:10px;width:380px;background:#1a2130;color:#e7edf6;padding:8px;border-radius:8px';
      const titulo = document.createElement('div');
      titulo.className = 'pokeidle-panel__title';
      titulo.textContent = 'DESAFIO DOS GYMS';
      const fechar = document.createElement('div');
      fechar.className = 'pokeidle-panel__close';
      fechar.textContent = '×';
      fechar.addEventListener('click', () => janela.remove());
      const aba = document.createElement('button');
      aba.textContent = 'KANTO';
      aba.className = 'is-active';
      janela.append(titulo, fechar, aba);
      document.body.append(janela);

      setTimeout(() => {
        for (const [texto, classe] of [
          ['HOJE Brock Pewter', 'gym-hotspot is-active'],
          ['Misty Cerulean', 'gym-hotspot'],
          ['ELITE FOUR', 'gym-hotspot gym-hotspot--league'],
        ]) {
          const h = document.createElement('button');
          h.className = classe;
          h.textContent = texto;
          h.addEventListener('click', () => anotar('ginasio'));
          janela.append(h);
        }
        const desafiar = document.createElement('button');
        desafiar.textContent = 'DESAFIAR AGORA';
        desafiar.addEventListener('click', () => {
          anotar('desafiar');
          // **Os dois cinemas**, com os textos medidos no jogo. O de entrada vem primeiro, usa as
          // MESMAS classes do de resultado, e pede um clique em "Entrar na arena" para a luta
          // começar. Foi por não distinguir os dois que a ferramenta marcava derrota antes da luta
          // e deixava a tela de vitória sem ninguém para confirmar.
          const entrada = document.createElement('h1');
          entrada.className = 'regional-cinema__title';
          entrada.textContent = 'Desafio de ginásio';
          const entrar = document.createElement('button');
          entrar.className = 'regional-cinema__skip';
          entrar.textContent = 'Entrar na arena';
          document.body.append(entrada, entrar);
          entrar.addEventListener('click', () => {
            anotar('entrar-na-arena');
            entrada.remove();
            entrar.remove();
            comecarALuta();
          });
        });

        const comecarALuta = () => {
          const relogio = document.createElement('div');
          relogio.className = 'pvp-battle-clock';
          relogio.textContent = '14:59';
          document.body.append(relogio);
          // Combate curto, como o real: 67 s no jogo, 5 s aqui.
          setTimeout(() => {
            relogio.remove();
            const t = document.createElement('h1');
            t.className = 'regional-cinema__title';
            t.textContent = 'Vitória!';
            document.body.append(t);
            // **O ponto do teste.** O título entra primeiro; o botão de confirmar só chega 2,5 s
            // depois, como no jogo — foi por isso que a ferramenta seguia para a troca de times
            // com o resumo da vitória ainda aberto na tela.
            setTimeout(() => {
              const skip = document.createElement('button');
              skip.className = 'regional-cinema__skip';
              skip.textContent = 'Continuar';
              // **O segundo ponto do teste.** O botão nasce DESLIGADO, enquanto o jogo confirma o
              // resultado — é o que a própria tela diz por cima dele, "Resultado e recompensas
              // confirmados". Clicar aqui dentro não faz nada, e era isso que acontecia.
              skip.disabled = true;
              setTimeout(() => {
                skip.disabled = false;
              }, 6000);
              skip.addEventListener('click', () => {
                anotar('continuar');
                t.remove();
                skip.remove();
              });
              document.body.append(skip);
            }, 2500);
          }, 5000);
        };
        janela.append(desafiar);
      }, 4000);
    });
  }

  const script = document.createElement('script');
  script.src = `../gym.js?t=${Date.now()}`;
  document.head.append(script);

  document.querySelector('[data-ver]').addEventListener('click', () => {
    document.querySelector('[data-saida]').textContent =
      localStorage.getItem('lioncode:gym:tarefa') || '— nenhuma tarefa guardada —';
  });
  document.querySelector('[data-limpar]').addEventListener('click', () => {
    localStorage.removeItem('lioncode:gym:tarefa');
    document.querySelector('[data-saida]').textContent = 'limpa';
  });
</script>
